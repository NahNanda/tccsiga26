<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Alerta de Faltas</title>
<base target="_blank">
</head>
<body>

<h2>Sistema de Alerta de Faltas</h2>

<form action="extrair.php" method="POST" enctype="multipart/form-data">

    <p>
        <label for="limite">Limite de faltas para alerta:</label><br>
        <input type="number" name="limite_faltas" id="limite" value="10" min="1" max="150" required>
    </p>

    <p>
        <label for="arquivo">Selecione o arquivo (PDF ou Excel):</label><br>
        <input type="file" name="arquivo" id="arquivo" accept=".pdf,.xlsx,.xls" required>
    </p>

    <p>
        <label for="destinatarios">Enviar alerta para (email):</label><br>
        <input type="text" name="destinatarios" id="destinatarios" placeholder="email@exemplo.com, outro@exemplo.com" size="40">
        <br><small>Deixe em branco para usar os emails padrão configurados no sistema. Para mais de um email, separe por vírgula.</small>
    </p>

    <p>
        <button type="submit">Extrair</button>
    </p>

</form>

</body>
</html>
